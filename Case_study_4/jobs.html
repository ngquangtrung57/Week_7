<!DOCTYPE html>
<html lang="en">
<head>
    <title>JavaJam Coffee House - Jobs</title>
    <meta charset="utf-8">
    <link rel="stylesheet" href="style.css">
    <script type="text/javascript" src="formvalidation.js" defer></script>
</head>
<body>
<div class="page">
<header>
    <h1>JavaJam Coffee House</h1>
</header>
<div class="content-wrapper">
    <nav>
        <a href="index.html">Home</a>
        <a href="menu.html">Menu</a>
        <a href="music.html">Music</a>
        <a href="jobs.html" class="active">Jobs</a>
    </nav>
    <main>
        <h2>Jobs at JavaJam</h2>
        <p>Want to work at JavaJam? Fill out the form below to start your application. Required fields are
            marked with an asterisk *</p>
        <form id="job-form" action="show_post.php" method="post" novalidate>
            <div class="form-row">
                <label for="name">*Name:</label>
                <input type="text" id="name" name="name" placeholder="Enter your name here" required>
                <span class="error" id="name-error" aria-live="polite"></span>
            </div>

            <div class="form-row">
                <label for="email">*E-mail:</label>
                <input type="email" id="email" name="email" placeholder="Enter your Email-ID here" required>
                <span class="error" id="email-error" aria-live="polite"></span>
            </div>

            <div class="form-row">
                <label for="startdate">Start Date:</label>
                <input type="date" id="startdate" name="startdate">
                <span class="error" id="startdate-error" aria-live="polite"></span>
            </div>

            <div class="form-row">
                <label for="experience">*Experience:</label>
                <textarea id="experience" name="experience" placeholder="Enter your past experience here (at least 20 characters)" maxlength="500" required></textarea>
                <span class="error" id="experience-error" aria-live="polite"></span>
            </div>

            <div class="buttons">
                <button type="reset">Clear</button>
                <button type="submit" id="form-submit">Apply Now</button>
            </div>
        </form>
    </main>
</div>
<footer>
    <small><i>Copyright &copy; 2014 JavaJam Coffee House<br>
        <a href="mailto:trung@nguyen.com">trung@nguyen.com</a></i></small>
</footer>
</div>
</body>
</html>
